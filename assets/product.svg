<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 680" width="340" height="680">
  <defs>
    <radialGradient id="bodyGrad" cx="35%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="60%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <radialGradient id="topGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#222"/>
    </radialGradient>
    <radialGradient id="yellowGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#c8a000"/>
    </radialGradient>
    <radialGradient id="cupGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)"/>
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#444"/>
      <stop offset="40%" stop-color="#888"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6fff6f"/>
      <stop offset="100%" stop-color="#00cc00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="bodyClip">
      <rect x="85" y="100" width="170" height="360" rx="18"/>
    </clipPath>
  </defs>

  <!-- Drop shadow group -->
  <g filter="url(#shadow)">

    <!-- ===== TOP CAP ===== -->
    <ellipse cx="170" cy="105" rx="78" ry="14" fill="url(#topGrad)"/>
    <rect x="92" y="92" width="156" height="30" rx="12" fill="url(#topGrad)"/>
    <ellipse cx="170" cy="92" rx="78" ry="14" fill="#2e2e2e"/>
    <!-- Silver rim ring -->
    <ellipse cx="170" cy="115" rx="78" ry="8" fill="none" stroke="url(#rimGrad)" stroke-width="3.5"/>

    <!-- Yellow power indicator circle on top -->
    <ellipse cx="170" cy="90" rx="28" ry="9" fill="url(#yellowGrad)"/>
    <ellipse cx="170" cy="88" rx="22" ry="6" fill="#ffe980" opacity="0.6"/>

    <!-- ===== MAIN BODY ===== -->
    <rect x="85" y="108" width="170" height="350" rx="20" fill="url(#bodyGrad)"/>

    <!-- Body highlight stripe -->
    <rect x="85" y="108" width="30" height="350" rx="20" fill="rgba(255,255,255,0.04)" clip-path="url(#bodyClip)"/>

    <!-- Silver rim at bottom of body -->
    <rect x="85" y="440" width="170" height="12" rx="0" fill="url(#rimGrad)" opacity="0.8"/>

    <!-- ===== GREEN POWER BUTTON ===== -->
    <!-- Button surround glow -->
    <ellipse cx="170" cy="272" rx="32" ry="44" fill="none" stroke="#00cc00" stroke-width="3" opacity="0.25" filter="url(#glow)"/>
    <!-- Button background oval -->
    <rect x="143" y="235" width="54" height="74" rx="27" fill="#0a1a0a"/>
    <rect x="145" y="237" width="50" height="70" rx="25" fill="url(#greenGlow)" opacity="0.15"/>
    <!-- Button border -->
    <rect x="143" y="235" width="54" height="74" rx="27" fill="none" stroke="url(#greenGlow)" stroke-width="2.5"/>
    <!-- Power icon -->
    <g transform="translate(170,272)">
      <path d="M0,-16 L0,-6" stroke="#4fff4f" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M-12,-10 A16,16 0 1,0 12,-10" fill="none" stroke="#4fff4f" stroke-width="3.5" stroke-linecap="round"/>
    </g>

    <!-- ===== USB-C PORT ===== -->
    <rect x="157" y="340" width="26" height="8" rx="4" fill="#111" stroke="#555" stroke-width="1.5"/>
    <rect x="160" y="342" width="20" height="4" rx="2" fill="#222"/>

    <!-- ===== BOTTOM MESH VENTS ===== -->
    <g opacity="0.5">
      <rect x="110" y="400" width="4" height="22" rx="2" fill="#555"/>
      <rect x="120" y="400" width="4" height="22" rx="2" fill="#555"/>
      <rect x="130" y="400" width="4" height="22" rx="2" fill="#555"/>
      <rect x="140" y="400" width="4" height="22" rx="2" fill="#555"/>
      <rect x="150" y="400" width="4" height="22" rx="2" fill="#555"/>
      <rect x="160" y="400" width="4" height="22" rx="2" fill="#555"/>
      <rect x="170" y="400" width="4" height="22" rx="2" fill="#555"/>
      <rect x="180" y="400" width="4" height="22" rx="2" fill="#555"/>
      <rect x="190" y="400" width="4" height="22" rx="2" fill="#555"/>
      <rect x="200" y="400" width="4" height="22" rx="2" fill="#555"/>
      <rect x="210" y="400" width="4" height="22" rx="2" fill="#555"/>
      <rect x="220" y="400" width="4" height="22" rx="2" fill="#555"/>
    </g>

    <!-- ===== ADAPTER COLLAR ===== -->
    <rect x="95" y="452" width="150" height="28" rx="10" fill="#141414" stroke="#333" stroke-width="1.5"/>
    <ellipse cx="170" cy="452" rx="75" ry="8" fill="#1c1c1c"/>
    <ellipse cx="170" cy="480" rx="70" ry="7" fill="#111"/>

    <!-- ===== CUP / RESERVOIR ===== -->
    <!-- Cup body -->
    <rect x="102" y="480" width="136" height="140" rx="16" fill="url(#cupGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <!-- Cup ribs -->
    <g opacity="0.25" stroke="rgba(255,255,255,0.4)" stroke-width="1" fill="none">
      <line x1="118" y1="480" x2="118" y2="620"/>
      <line x1="130" y1="480" x2="130" y2="620"/>
      <line x1="142" y1="480" x2="142" y2="620"/>
      <line x1="154" y1="480" x2="154" y2="620"/>
      <line x1="166" y1="480" x2="166" y2="620"/>
      <line x1="178" y1="480" x2="178" y2="620"/>
      <line x1="190" y1="480" x2="190" y2="620"/>
      <line x1="202" y1="480" x2="202" y2="620"/>
      <line x1="214" y1="480" x2="214" y2="620"/>
      <line x1="226" y1="480" x2="226" y2="620"/>
    </g>
    <!-- Cup shine -->
    <rect x="108" y="488" width="18" height="100" rx="9" fill="rgba(255,255,255,0.12)"/>
    <!-- Cup bottom -->
    <ellipse cx="170" cy="620" rx="68" ry="10" fill="rgba(255,255,255,0.1)"/>

    <!-- Fill level indicator -->
    <rect x="232" y="530" width="4" height="5" rx="1" fill="rgba(255,255,255,0.4)"/>
    <rect x="232" y="545" width="4" height="5" rx="1" fill="rgba(255,255,255,0.3)"/>
    <rect x="232" y="560" width="4" height="5" rx="1" fill="rgba(255,255,255,0.2)"/>

  </g>
</svg>
